[project]
name = "thyca-discord-mcp"
version = "0.1.0"
description = "MCP server around discord.py for single-agent Discord guild management with multi-task support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.7,<3",
    "mcp>=1.0,<2",  # verified against 1.29 FastMCP API; 2.x unchecked
    "pydantic-settings>=2",
    "typesafe-sdk==0.7.2",  # pinned Jev SDK; this package migrated to modum
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[project.scripts]
thyca-discord-mcp = "modum.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modum"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
