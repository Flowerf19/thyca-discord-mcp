[project]
name = "thyca-discord-mcp"
version = "0.1.0"
description = "MCP server around discord.py for single-agent Discord guild management with multi-task support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.7,<3",
    "mcp>=1.0,<2",  # verified against 1.29 FastMCP API; 2.x unchecked
    "pydantic-settings>=2",
    "typesafe-sdk==0.7.2",  # pinned Jev SDK; this package migrated to modum
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[project.scripts]
thyca-discord-mcp = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delivery", "src/participation", "src/responder", "src/server"]

[tool.hatch.build.targets.wheel.force-include]
"src/audit.py" = "audit.py"
"src/bot.py" = "bot.py"
"src/config.py" = "config.py"
"src/context.py" = "context.py"
"src/conversation.py" = "conversation.py"
"src/delivery_schema.py" = "delivery_schema.py"
"src/delivery_storage.py" = "delivery_storage.py"
"src/identity.py" = "identity.py"
"src/jev.py" = "jev.py"
"src/main.py" = "main.py"
"src/outbox.py" = "outbox.py"
"src/server_helpers.py" = "server_helpers.py"
"src/server_ticks.py" = "server_ticks.py"
"src/source_messages.py" = "source_messages.py"
"src/tasks.py" = "tasks.py"
"src/thyca.py" = "thyca.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
